name: Docker Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-job:
    runs-on: self-hosted
    env:
      # 代理放在这里全局生效
      http_proxy: http://192.168.171.1:7890
      https_proxy: http://192.168.171.1:7890

    # 只有一个 steps 关键字！
    steps:
      # 1. 强制清理 (Pre-cleanup)
      - name: Pre-cleanup
        run: |
          echo "强制清理目录..."
          WORK_DIR=${{ github.workspace }}
          if [ -d "$WORK_DIR" ]; then
            echo "正在清理: $WORK_DIR"
            sudo rm -rf "$WORK_DIR"/*
            sudo rm -rf "$WORK_DIR"/.* || true
          else
            echo "目录不存在，跳过清理"
          fi

      # 2. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. 部署

      - name: Deploy with Docker Compose
        # 1. 关键修改：先将 Secret 映射为环境变量
        env:
          DEBUG_PWD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          echo "🚧 进入调试模式..."

          # 2. 打印长度 (这次不会报错了)
          echo "GitHub Secret 长度: ${#DEBUG_PWD}"

          echo "正在生成 .env 文件..."

          # ==========================================
          # ⚠️ 暴力测试：直接写死密码！
          # 我们不依赖 Secret 了，直接用 'password123'
          # ==========================================
          echo "MYSQL_ROOT_PASSWORD=password123" > .env
          echo "DB_NAME=work_diary_db" >> .env

          echo "--- .env 内容预览 ---"
          cat .env
          echo "---------------------"

          echo "停止旧容器..."
          docker compose --env-file .env down || true

          echo "开始构建并启动容器..."
          docker compose --env-file .env up -d --build --remove-orphans

          # 调试期间保留 .env
          # rm .env


      # 4. 清理镜像
      - name: Cleanup
        run: |
          docker image prune -f
