name: Docker Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-job:
    runs-on: self-hosted
    env:
      # 代理放在这里全局生效
      http_proxy: http://192.168.171.1:7890
      https_proxy: http://192.168.171.1:7890

    # 只有一个 steps 关键字！
    steps:
      # 1. 强制清理 (Pre-cleanup)
      - name: Pre-cleanup
        run: |
          echo "强制清理目录..."
          WORK_DIR=${{ github.workspace }}
          if [ -d "$WORK_DIR" ]; then
            echo "正在清理: $WORK_DIR"
            sudo rm -rf "$WORK_DIR"/*
            sudo rm -rf "$WORK_DIR"/.* || true
          else
            echo "目录不存在，跳过清理"
          fi

      # 2. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. 部署

      - name: Deploy with Docker Compose
        run: |
          echo "🚧 进入调试模式..."
          
          # 1. 打印 Secret 的长度（不打印内容，只看是不是 0）
          # 如果这里输出 0，说明 GitHub 根本没把密码传过来
          SECRET_LEN=${#{{ secrets.MYSQL_ROOT_PASSWORD }}}
          echo "当前 Secret 长度为: $SECRET_LEN"

          echo "正在生成 .env 文件..."
          
          # ==========================================
          # ⚠️ 临时暴力测试：直接写死密码！
          # 不要用 secrets 了，直接写 password123
          # ==========================================
          echo "MYSQL_ROOT_PASSWORD=password123" > .env
          echo "DB_NAME=work_diary_db" >> .env
          
          # 打印一下 .env 文件的内容确认一下（生产环境不要这样做）
          echo "--- .env 内容预览 ---"
          cat .env
          echo "---------------------"

          echo "停止旧容器..."
          docker compose --env-file .env down || true

          echo "开始构建并启动容器..."
          docker compose --env-file .env up -d --build --remove-orphans
          
          # ⚠️ 调试期间，先不要删除 .env，方便你进去检查
          # rm .env

      # 4. 清理镜像
      - name: Cleanup
        run: |
          docker image prune -f
