name: Docker Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-job:
    runs-on: self-hosted
    env:
      # 代理放在这里全局生效
      http_proxy: http://192.168.171.1:7890
      https_proxy: http://192.168.171.1:7890

    # 只有一个 steps 关键字！
    steps:
      # 1. 强制清理 (Pre-cleanup)
      - name: Pre-cleanup
        run: |
          echo "强制清理目录..."
          WORK_DIR=${{ github.workspace }}
          if [ -d "$WORK_DIR" ]; then
            echo "正在清理: $WORK_DIR"
            sudo rm -rf "$WORK_DIR"/*
            sudo rm -rf "$WORK_DIR"/.* || true
          else
            echo "目录不存在，跳过清理"
          fi

      # 2. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 3. 运行自动化测试
      # 利用 Docker 临时构建一个镜像，在里面跑 pytest
      # ==========================================
      - name: Run Unit Tests
        run: |
          echo "🔎 runner 上 python-app 目录内容："
          ls -la ./python-app

          echo "🔎 runner 上 python-app 里的测试文件："
          find ./python-app -maxdepth 1 -type f -name "test_*.py" -o -name "*_test.py" || true

          echo "🏗️ docker build（禁用缓存，避免用旧镜像）："
          docker build --no-cache -t test-image ./python-app

          echo "🔎 镜像内 /app 内容："
          docker run --rm test-image sh -lc "pwd; ls -la; find . -maxdepth 1 -type f -name 'test_*.py' -o -name '*_test.py' || true"

          echo "🔎 pytest 收集情况："
          docker run --rm test-image pytest -q --collect-only

          echo "▶ 正式执行测试："
          docker run --rm test-image pytest -q


         

      # 3. 部署
      - name: Deploy with Docker Compose
        # 把 Secret 映射为环境变量，这样最稳健
        env:
          ENV_MYSQL_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ENV_DB_NAME: ${{ secrets.DB_NAME }}
          ENV_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "正在生成 .env 文件..."

          # 简单的非空检查
          if [ -z "$ENV_MYSQL_PASS" ]; then
            echo "❌ 错误: GitHub Secret 依然为空！请检查网页配置。"
            exit 1
          fi

          echo "MYSQL_ROOT_PASSWORD=$ENV_MYSQL_PASS" > .env
          echo "DB_NAME=$ENV_DB_NAME" >> .env
          
          echo "GROQ_API_KEY=$ENV_GROQ_KEY" >> .env

          echo "停止旧容器..."
          docker compose --env-file .env down || true

          echo "开始构建并启动容器..."
          docker compose --env-file .env up -d --build --remove-orphans

          echo "清理敏感文件..."
          rm .env

          

      # 4. 清理镜像
      - name: Cleanup
        run: |
          docker image prune -f
