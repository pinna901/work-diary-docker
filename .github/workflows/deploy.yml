name: Docker Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-job:
    runs-on: self-hosted
    env:
      # 代理放在这里全局生效
      http_proxy: http://192.168.171.1:7890
      https_proxy: http://192.168.171.1:7890

    # 只有一个 steps 关键字！
    steps:
      # 1. 强制清理 (Pre-cleanup)
      - name: Pre-cleanup
        run: |
          echo "强制清理目录..."
          WORK_DIR=${{ github.workspace }}
          if [ -d "$WORK_DIR" ]; then
            echo "正在清理: $WORK_DIR"
            sudo rm -rf "$WORK_DIR"/*
            sudo rm -rf "$WORK_DIR"/.* || true
          else
            echo "目录不存在，跳过清理"
          fi

      # 2. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 3. 运行自动化测试
      # 利用 Docker 临时构建一个镜像，在里面跑 pytest
      # ==========================================
      - name: Run Unit Tests
        run: |
          echo "🔎 runner 上 python-app 目录内容："
          ls -la ./python-app

          echo "🔎 runner 上 python-app 里的测试文件："
          find ./python-app -maxdepth 1 -type f -name "test_*.py" -o -name "*_test.py" || true

          echo "🏗️ docker build（启用缓存，加快构建速度）："
          docker build -t test-image ./python-app

          echo "🔎 镜像内 /app 内容："
          docker run --rm test-image sh -lc "pwd; ls -la; find . -maxdepth 1 -type f -name 'test_*.py' -o -name '*_test.py' || true"

          echo "🔎 pytest 收集情况："
          docker run --rm test-image pytest -q --collect-only

          echo "▶ 正式执行测试："
          docker run --rm test-image pytest -q


         

      # 3. 清理旧容器
      - name: Stop and Remove Old Containers
        run: |
          echo "🧹 停止并删除旧容器..."
          
          # 停止并删除所有服务（包括 volumes）
          docker compose down -v || true
          
          # 强制删除可能残留的容器
          docker rm -f work-redis work-mysql work-python-app work-nginx || true
          
          # 清理悬空的镜像和容器（可选，节省空间）
          docker system prune -f || true
          
          echo "✅ 旧容器清理完成"

      # 4. 部署
      - name: Deploy with Docker Compose
        # 把 Secret 映射为环境变量，这样最稳健
        env:
          ENV_MYSQL_PASS: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ENV_DB_NAME: ${{ secrets.DB_NAME }}
          ENV_GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "📝 正在生成 .env 文件..."

          # 简单的非空检查
          if [ -z "$ENV_MYSQL_PASS" ]; then
            echo "❌ 错误: GitHub Secret 依然为空！请检查网页配置。"
            exit 1
          fi

          echo "MYSQL_ROOT_PASSWORD=$ENV_MYSQL_PASS" > .env
          echo "DB_NAME=$ENV_DB_NAME" >> .env
          echo "GROQ_API_KEY=$ENV_GROQ_KEY" >> .env

          echo "🚀 启动服务..."
          docker compose --env-file .env up -d --build --force-recreate
          
          echo "⏳ 等待服务启动..."
          sleep 10
          
          echo "✅ 检查服务状态..."
          docker compose ps
          
          echo "🎉 部署完成！"
          
          echo "🧹 清理敏感文件..."
          rm -f .env

      # 5. 清理镜像
      - name: Cleanup
        run: |
          docker image prune -f
