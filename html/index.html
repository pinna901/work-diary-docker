<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>搬砖记日 -幸存版</title>
    <!-- 引用外部 CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h3>The officially recorded days i've survived from back-breaking labor</h3>
        <div class="count" id="day-count">--</div>
        <div id="status-msg" style="font-size: 12px; color: gray;">连接中...</div>
        <button onclick="clockIn()"> 立即打卡</button>
    </div>

    <div class="card">
        <h3>write your diary</h3>
        <input type="text" id="diary-input" placeholder="写点什么...">
        <button onclick="addDiary()">保存</button>
    </div>

    <div id="diary-list"></div>

    <script src="script.js"></script>
</body>
</html>
