<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>搬砖记日 -modelifying</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 400px; margin-bottom: 20px;}
        .count { font-size: 80px; color: #4CAF50; margin: 20px 0; font-weight: bold; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 5px;}
        button:hover { background: #0056b3; }
        input { padding: 10px; width: 70%; border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; }
        .diary-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width: 400px; text-align: left; }
        .diary-quote { font-size: 12px; color: #666; font-style: italic; margin-top: 5px; border-top: 1px dashed #eee; padding-top: 5px;}
    </style>
</head>
<body>

    <div class="card">
        <h3>已坚持搬砖</h3>
        <div class="count" id="day-count">--</div>
        <div id="status-msg" style="font-size: 12px; color: gray;">连接中...</div>
        <button onclick="clockIn()"> 立即打卡</button>
    </div>

    <div class="card">
        <h3>写日记</h3>
        <input type="text" id="diary-input" placeholder="写点什么...">
        <button onclick="addDiary()">保存</button>
    </div>

    <div id="diary-list"></div>

<script>
    const API_BASE = '/api';

    window.onload = function() { checkStatus(); loadDiaries(); };

    async function checkStatus() {
        try {
            const res = await fetch(`${API_BASE}/status`);
            const data = await res.json();
            document.getElementById('day-count').innerText = data.count;
            document.getElementById('status-msg').innerText = `数据库模式: ${data.db || '未知'}`;
        } catch (e) {
            document.getElementById('status-msg').innerText = "获取状态失败: " + e.message;
        }
    }

    // --- 重点修改了这里，增加了详细的错误捕捉 ---
    async function clockIn() {
        try {
            console.log("开始请求打卡...");
            const res = await fetch(`${API_BASE}/clock-in`, { method: 'POST' });
            
            console.log("服务器状态码:", res.status);
            
            // 先以文本形式读取，防止 JSON 解析挂了不知道原因
            const text = await res.text();
            console.log("服务器返回原始内容:", text);

            if (!res.ok) {
                throw new Error(`服务器报错: ${res.status} - ${text}`);
            }

            // 尝试解析 JSON
            let data;
            try {
                data = JSON.parse(text);
            } catch (jsonError) {
                throw new Error("返回的不是有效 JSON！内容是：" + text);
            }
            
            alert("成功: " + data.message);
            
            // 成功后刷新数字
            checkStatus(); 

        } catch (e) {
            console.error("JS 报错:", e);
            // 这里会直接弹窗告诉你具体的错误原因
            alert("❌ 打卡流程出错:\n" + e.message);
        }
    }

    async function addDiary() {
        const content = document.getElementById('diary-input').value;
        if(!content) return;
        try {
            const res = await fetch(`${API_BASE}/diary`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            const data = await res.json();
            alert(`保存成功！\n${data.entry.quote}`);
            document.getElementById('diary-input').value = '';
            loadDiaries();
        } catch (e) {
            alert("日记保存失败: " + e.message);
        }
    }

    async function loadDiaries() {
        const res = await fetch(`${API_BASE}/diary`);
        const data = await res.json();
        const listDiv = document.getElementById('diary-list');
        listDiv.innerHTML = '';
        data.diaries.forEach(d => {
            const item = document.createElement('div');
            item.className = 'diary-item';
            item.innerHTML = `<div>${d.content}</div><div class="diary-quote">${d.quote || ''}</div>`;
            listDiv.appendChild(item);
        });
    }
</script>
</body>
</html>
