services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - python-app

  python-app:
    # 指向子文件夹
    build: ./python-app
    volumes:
      - ./python-app:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/python:/app/logs
    environment:
      # 统一 Key: Value 格式，严禁混用横杠
      TZ: Asia/Shanghai
      FLASK_DEBUG: "1"
      FLASK_APP: app.py
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: db
    dns:
      - 223.5.5.5
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: work-redis
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
    restart: always

  db:
    image: mariadb:10.6
    container_name: work-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    restart: always
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
