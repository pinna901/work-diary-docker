services:
  # Nginx 前端
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443" # a new https port
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - python-app

  # Python 后端
  python-app:
    build: ./python-app
    volumes:
      - ./python-app:/app
      # --- 新增这两行，直接同步宿主机的时区配置 ---
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./logs/python:/app/logs
    environment:
      TZ: Asia/Shanghai
      FLASK_DEBUG: "1"
      FLASK_APP: app.py
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: db
      # 告诉 Gunicorn 日志文件的位置
      GUNICORN_CMD_ARGS: "--access-logfile /app/logs/access.log --error-logfile /app/logs/error.log --log-level info"
    deploy:
      replicas: 1
    dns:
      - 223.5.5.5
      - 8.8.8.8
    depends_on:
      - redis
      - db

  # Redis 数据库
  redis:
    image: redis:alpine
    container_name: work-redis
    volumes:
      - ./redis_data:/data
    # AOF persistently saving data into local disk
    command: redis-server --appendonly yes
    restart: always

  # MySQL 数据库 (新增)
  db:
    image: mariadb:10.6
    environment:
    # 使用 ${VAR} 语法引用变量
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    # 数据持久化 (挂载到本地的 mysql_data 目录)
    container_name: work-mysql
    restart: always

    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306" #DBeaaver could connetc our db with this port

