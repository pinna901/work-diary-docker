services:
  # Nginx 前端
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443" # a new https port
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - python-app

  # Python 后端
  python-app:
    build: ./python-app
    volumes:
      - ./python-app:/app
      # --- 新增这两行，直接同步宿主机的时区配置 ---
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Shanghai
      - FLASK_DEBUG=1
      - FLASK_APP=app.py
    deploy:
      replicas: 1
    dns:
      - 223.5.5.5
      - 8.8.8.8
    depends_on:
      - redis
      - db

  # Redis 数据库
  redis:
    # 这里用你本地已有的镜像名，可能是 redis:alpine 或 redis:latest
    image: redis:alpine
    container_name: work-redis
    volumes:
      - ./redis_data:/data
    # AOF persistently saving data into local disk
    command: redis-server --appendonly yes
    restart: always

  # MySQL 数据库 (新增)
  db:
    image: mariadb:10.6
    container_name: work-mysql
    # 就算挂了也要自动重启
    restart: always
    # 设置默认密码和数据库名 (这是 MySQL 镜像特有的环境变量)
    environment:
      # 给密码加上双引号，强制识别为字符串
      MYSQL_ROOT_PASSWORD: "0901"
      MYSQL_DATABASE: work_diary_db
    # 数据持久化 (挂载到本地的 mysql_data 目录)
    volumes:
      - ./mysql_data:/var/lib/mysql
    # 端口映射 (可选：如果你想用 Windows 上的 Navicat/DBeaver 连接它，就打开)
    ports:
      - "3306:3306"
